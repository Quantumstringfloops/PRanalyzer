name: Merge outcome

# review-app's "after the merge" bot, run by GitHub Actions instead of a GitHub App. When a pull
# request is merged into main, it looks at how the merge turned out: CI on the merge commit, a
# later revert, follow-up fixes to the PR's files. It keeps one comment on the PR up to date with
# what it found, posted as github-actions[bot]. It reads and comments, and never changes code.
#
# It looks right after the merge, again when main's CI finishes on the merge commit, and then once
# a day until the 7-day watch is over. Each run starts with an empty database: the comment it
# posted before is found on the PR by its hidden marker and edited in place.
#
# Why these triggers, and why they're safe:
# - A merge starts it through pull_request, not pull_request_target. GitHub runs
#   pull_request_target from the default branch's copy of a workflow, whatever the base, while
#   pull_request uses the merge commit's: code that main already holds once the PR is merged.
# - The job only runs for a merged PR, and only for one from a branch of this repository. A fork's
#   token can't comment, so the look when main's CI finishes covers those PRs.
# - workflow_run, schedule and workflow_dispatch run main's copy, with main checked out.
# - There's no secret, only GITHUB_TOKEN, which may read and comment and nothing more.
# - Event data reaches the scripts only through env.
on:
  pull_request:
    types: [closed]
    # demo only: the throwaway branch review-app-demo/base stands in for main
    branches: [main, review-app-demo/base]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Number of a merged pull request to look at now
        required: true
        type: string

# nothing by default; the job below asks for what it needs
permissions: {}

# the look right after a merge and the one when CI finishes take turns, so they can't both post a
# first comment
concurrency:
  group: >-
    merge-outcome-${{ github.event.pull_request.merge_commit_sha
    || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  look:
    # The check run is named after the job. review-app leaves its own check, "review-app", out of
    # the merge commit's CI, so this run doesn't count as CI that's still running.
    name: review-app
    # a merged PR from this repository; CI that ran on a push to main (not on a pull request); the
    # daily look; by hand
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push') ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read         # the base branch's later commits, and the files they changed
      pull-requests: write   # read the PR and its files, and post or edit the comment
      checks: read           # CI's check runs on the merge commit
      statuses: read         # and its commit statuses

    # actions are pinned to commits, since a tag can be moved to different code; the comment
    # names the release
    steps:
      # the merge commit, for a merged PR; main's head otherwise
      - name: Check out the merged code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install review-app
        run: python -m pip install --quiet --disable-pip-version-check './pr-analyzer[security]' ./review-app

      # Event data reaches the script through env only, never through ${{ }} inside it.
      - name: Find the merged pull requests to look at
        id: find
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          MERGED_PR: ${{ github.event.pull_request.number }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          ASKED_PR: ${{ inputs.pr }}
        run: |
          case "$EVENT" in
            pull_request) prs="$MERGED_PR" ;;
            workflow_dispatch) prs="$ASKED_PR" ;;
            workflow_run)
              # the PR whose merge this commit is
              prs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$CI_SHA/pulls" \
                --jq '.[] | select(.merged_at != null and .base.ref == "main") | .number') ;;
            schedule)
              # merged in the last 8 days: one more look at each, and the last one closes the watch
              since=$(date -u -d "8 days ago" +%F)
              prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state merged \
                --search "merged:>=$since" --limit 100 --json number --jq '.[].number') ;;
          esac
          echo "prs=${prs//$'\n'/ }" >> "$GITHUB_OUTPUT"

      - name: Look at how they turned out
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_APP_DB: ${{ runner.temp }}/review-app.db
          PRS: ${{ steps.find.outputs.prs }}
        run: |
          if [ -z "$PRS" ]; then
            echo "No merged pull request to look at." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=0
          for pr in $PRS; do
            if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
              echo "::error::Not a pull request number: $pr"
              status=1
              continue
            fi
            if ! review-app outcome "https://github.com/$GITHUB_REPOSITORY/pull/$pr" --comment \
                | tee "$RUNNER_TEMP/outcome.txt"; then
              echo "::error::review-app couldn't finish its look at #$pr: see the log above"
              status=1
            fi
            { echo "#### #$pr"; echo '```'; cat "$RUNNER_TEMP/outcome.txt"; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status
