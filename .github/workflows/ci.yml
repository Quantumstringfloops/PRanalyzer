name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# the Python project lives in pr-analyzer/, not at the repository root
defaults:
  run:
    working-directory: pr-analyzer

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pip install "poetry>=2,<3"

      - name: Check poetry.lock matches pyproject.toml
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --no-interaction --all-extras

      - name: Run ruff
        run: poetry run ruff check src tests

      - name: Run mypy
        run: poetry run mypy src --ignore-missing-imports

      - name: Run tests
        run: poetry run pytest --tb=short
