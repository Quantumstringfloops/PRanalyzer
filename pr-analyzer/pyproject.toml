[tool.poetry]
name = "pr-analyzer"
version = "0.1.0"
description = "AI-powered pull request analyzer"
authors = ["Neil Mathew"]
readme = "README.md"
packages = [{ include = "pr_analyzer", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pygithub = "^2.3"
# Typer 0.27+ no longer depends on Click. 0.12 broke on Click >= 8.2: --help crashed and
# boolean flags parsed as strings or None.
typer = "^0.27"
rich = "^13.8"
pydantic-settings = "^2.3"
python-dotenv = "^1.0"
structlog = "^24.2"
httpx = "^0.27"
tree-sitter = "^0.25"
tree-sitter-python = "^0.25"
tree-sitter-javascript = "^0.25"
tree-sitter-typescript = "^0.23"
openai = { version = ">=1.30,<4", optional = true }
anthropic = { version = ">=0.28,<3", optional = true }
semgrep = { version = "^1.181", optional = true }
pip-audit = { version = "^2.10", optional = true }

[tool.poetry.extras]
openai = ["openai"]
anthropic = ["anthropic"]
security = ["semgrep", "pip-audit"]

[tool.poetry.scripts]
pr-analyzer = "pr_analyzer.cli:app"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "^5.0"
ruff = "^0.4"
mypy = "^1.10"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
