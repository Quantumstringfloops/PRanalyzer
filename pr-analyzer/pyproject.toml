[tool.poetry]
name = "pr-analyzer"
version = "0.1.0"
description = "AI-powered pull request analyzer"
authors = ["Neil Mathew"]
readme = "README.md"
packages = [{ include = "pr_analyzer", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pygithub = "^2.3"
typer = { extras = ["all"], version = "^0.12" }
rich = "^13.7"
pydantic-settings = "^2.3"
python-dotenv = "^1.0"
structlog = "^24.2"

[tool.poetry.scripts]
pr-analyzer = "pr_analyzer.cli:app"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
ruff = "^0.4"
mypy = "^1.10"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"