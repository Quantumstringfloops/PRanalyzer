[tool.poetry]
name = "pr-analyzer"
version = "0.1.0"
description = "AI-powered pull request analyzer"
authors = ["Neil Mathew"]
readme = "README.md"
packages = [{ include = "pr_analyzer", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pygithub = "^2.3"
typer = { extras = ["all"], version = "^0.12" }
rich = "^13.7"
pydantic-settings = "^2.3"
python-dotenv = "^1.0"
structlog = "^24.2"
openai = { version = "^1.30", optional = true }
anthropic = { version = "^0.28", optional = true }
httpx = "^0.27"
tree-sitter = "^0.25"
tree-sitter-python = "*"
tree-sitter-javascript = "*"

[tool.poetry.extras]
openai = ["openai"]
anthropic = ["anthropic"]

[tool.poetry.scripts]
pr-analyzer = "pr_analyzer.cli:app"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "^5.0"
ruff = "^0.4"
mypy = "^1.10"
semgrep = "^1.181.0"
pip-audit = "^2.10.1"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"