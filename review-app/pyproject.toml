[project]
name = "review-app"
version = "0.1.0"
description = "Review every pull request with pr-analyzer, then merge it, send it to a human or block it, fail-safe"
authors = [{ name = "Neil Mathew" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # the analysis engine, with Semgrep and pip-audit: a scanner missing means no merges. Install
    # it from ../pr-analyzer (see README): the NVIDIA provider isn't in a PyPI release yet.
    "pr-analyzer-cli[security]",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "typer>=0.27,<0.28",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pygithub>=2.3,<3",
    "structlog>=24.2,<25",
    # dashboard login: Supabase Auth's REST API, and checking its access tokens
    "httpx>=0.27,<1",
    "pyjwt[crypto]>=2.8,<3",
]

[project.optional-dependencies]
# httpx is what FastAPI's TestClient drives the apps with; pr-analyzer pins it below 0.28
dev = ["pytest", "httpx>=0.27,<0.28", "ruff", "mypy"]

[project.scripts]
review-app = "review_app.cli:app"

[tool.poetry]
requires-poetry = ">=2.2"
packages = [{ include = "review_app", from = "src" }]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # Starlette would like httpx >= 0.28 for TestClient; pr-analyzer pins httpx below it
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[build-system]
requires = ["poetry-core>=2.2,<3"]
build-backend = "poetry.core.masonry.api"
